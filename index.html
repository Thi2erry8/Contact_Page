<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser"></script>
    <link
      rel="icon"
      href="resources/favicon.ico"
      type="image/x-icon"
      sizes="96x96"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <title>Contact Page | devChallenges.io</title>

    <!--You are welcome to delete these styles or modify them in your own stylesheet -->
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        background-image: url("./resources/background.svg");
        background-position: center;
        background-repeat: no-repeat;
        background-size: cover;
        font-family: "Be Vietnam Pro";
      }
    </style>
  </head>
  <body>
    <!-- 
  Interested in our business pricing?
   
  Fill out the form to view details and we’ll contact you as soon as possible.
  
  Name

  Ethan Johnson

  Company Email
  
  ethan@johnson.com

  Company Size

  50-100 employees
  
  Subject

  Building Landing pages

  Message

  50-100 employees

  Contact Sales
  -->
    <header class="p-5">
      <img src="./resources/Logo.svg" />
    </header>
    <main>
      <section
        class="text-neutral-50 flex flex-col justify-center items-center"
      >
        <h2 class="text-6xl font-semibold">
          Interested in our <br />
          business pricing?
        </h2>
        <p class="text-2xl mt-4">
          Fill out the form to view details and we’ll <br />
          contact you as soon as possible.
        </p>
        <form
          name="info"
          class="w-3/5 bg-neutral-100/40 rounded-xl p-1 flex flex-col mt-4"
        >
          <!--  #1 -->
          <div class="flex flex-row items-center justify-around gap-5">
            <!-- input1 -->
            <div class="flex flex-col w-2/5">
              <p class="font-semibold mb-2">Name</p>
              <input
                type="text"
                placeholder="Ethan Johnson"
                class="placeholder:text-neutral-950 placeholder:bold bg-neutral-100 py-4 pl-3 rounded-lg"
              />
            </div>

            <!-- input2 -->
            <div class="flex flex-col w-2/5">
              <p class="font-semibold mb-2">Company Email</p>
              <input
                type="text"
                placeholder="ethan@johnson.com"
                class="placeholder:text-neutral-950 placeholder:bold bg-neutral-100 py-4 pl-3 rounded-lg"
              />
            </div>
          </div>

          <!--  #2 -->
          <div class="flex flex-row items-center justify-around gap-5">
            <!-- input1 -->
            <div class="flex flex-col w-2/5">
              <p class="font-semibold mb-2">Company size</p>
              <select
                name="employees"
                id="employees"
                class="bg-neutral-100 text-neutral-950 py-4 pl-3 rounded-lg"
              >
                <option value="volvo">50-100 employees</option>
                <option value="saab">100-150 employees</option>
                <option value="mercedes">150-200 employees</option>
                <option value="audi">200-250 employees</option>
              </select>
            </div>

            <!-- input2 -->
            <div class="flex flex-col w-2/5">
              <p class="font-semibold mb-2">Subject</p>
              <select
                name="sector"
                id="sector"
                class="bg-neutral-100 text-neutral-950 py-4 pl-3 rounded-lg"
              >
                <option value="volvo">Building Landing Page</option>
                <option value="saab">Api Integration</option>
                <option value="mercedes">Database Conception</option>
              </select>
            </div>
          </div>

          <div class="flex flex-col w-full p-10 height-50">
            <p class="font-semibold mb-2">Company Email</p>
            <textarea
              name=""
              id=""
              class="bg-neutral-100 rounded-lg height-full"
              rows="4"
              cols="300"
              placeholder="50-100 employees"
            ></textarea>
          </div>

          <div class="w-full h-16 px-10 mb-4">
            <button class="border-none bg-neutral-100 w-full h-full rounded-lg">
              <p class="text-[#4036A9] text-lg">Contact Sales</p>
            </button>
          </div>
        </form>
      </section>
    </main>
  </body>
</html>
